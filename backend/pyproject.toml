[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "internship-tracker-backend"
version = "0.4.2"
description = "Internship Tracker (backend)"
requires-python = ">=3.11"

dependencies = [
    "alembic>=1.19.0,<2.0.0",
    "fastapi>=0.140.0,<1.0.0",
    "google-auth>=2.56.0,<3.0.0",
    "google-auth-oauthlib>=1.4.0,<2.0.0",
    "pydantic-settings>=2.14.0,<3.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "pytest>=9.1.0,<10.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "python-jose[cryptography]>=3.5.0,<4.0.0",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "uvicorn>=0.51.0,<1.0.0"
]